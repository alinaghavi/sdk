[package]
name = "steery-driver-example"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The smallest Steery driver: copy this folder to start one for your harness"

[[bin]]
name = "steery-driver-example"
path = "main.rs"

[dependencies]
steery-sdk = { path = "../.." }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

# A crate of its own, not a member of the SDK's: copied out, it builds as it is once
# `steery-sdk` names the published crate (README.md, "Writing a driver").
[workspace]
